<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Late Checkout | Review My Stay</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Playfair+Display:wght@500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="page-shell page-shell-narrow">
      <header class="hero">
        <nav class="top-nav" aria-label="Primary">
          <a class="brand-mark" href="/" aria-label="late checkout home">
            <img class="brand-logo" src="/logo-stay.svg" alt="late checkout" />
          </a>
          <div class="nav-links">
            <a href="/">Home</a>
            <a href="/check/" class="is-active">Check my stay</a>
            <a href="/start/">Start my stay</a>
            <a href="/faqs.html">FAQs</a>
          </div>
        </nav>
        <h1>Check my stay</h1>
        <p class="hero-copy">Provide your reservation details and we'll check for better rates and/or perks for your stay.</p>
      </header>

      <section class="page-feature" aria-label="Rate tracking form">
        <article class="card page-form-pane" id="tracking-card">
          <div class="form-shell">
            <iframe
              class="form-embed"
              src="https://docs.google.com/forms/d/e/1FAIpQLSeukhl6HiPBpMidsAHpCO1EQJLXVNoXlVthpU1UfGu-PAf-uw/viewform?embedded=true"
              title="Late Checkout request form"
              loading="lazy"
            >
              Loading...
            </iframe>
          </div>
        </article>
        <aside class="page-visual page-image-pane page-visual-no-bottom" aria-hidden="true">
          <img src="/images/page-1.jpg" alt="" />
        </aside>
      </section>
    </main>

    <footer class="site-footer">
    <div class="footer-inner">
      <a class="footer-brand" href="/" aria-label="late checkout home">
        <img class="footer-logo" src="/logo-stay-white.svg" alt="late checkout" />
      </a>
      <nav class="footer-links" aria-label="Footer">
        <a href="/about.html">About</a>
        <a href="/faqs.html">FAQs</a>
        <a href="/contact.html">Contact</a>
      </nav>
    </div>
  </footer>
</body>
</html>
