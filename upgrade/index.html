    <main class="page-shell page-shell-narrow">
      <header class="hero">
        <nav class="top-nav" aria-label="Primary">
          <a class="brand-mark" href="/" aria-label="late checkout home">
            <img class="brand-logo" src="/logo-stay.svg" alt="late checkout" />
          </a>
          <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="primary-nav" aria-label="Toggle navigation">
            <span class="sr-only">Menu</span>
            <span class="hamburger-lines" aria-hidden="true"><span></span><span></span><span></span></span>

        <h1>Upgrade my stay</h1>
        <p class="hero-copy">Provide your reservation details and we'll check for better rates and/or perks for your stay.</p>
      </header>

      <section class="page-feature" aria-label="Rate tracking form">
        <article class="card page-form-pane" id="tracking-card">
          <div class="form-shell">
            <form id="tracking-form" action="https://script.google.com/macros/s/AKfycbz9q_LZ3VtMboPw2aeLXlnCoz0puKk5Nf2hnk5RaFL7A_a1Sh2BKVWIEpht-KwzYMqMAw/exec" method="POST" novalidate>
              <input type="hidden" name="formType" value="check" />
              <input type="hidden" name="source" value="latecheckouttravel.com/upgrade" />
              <input type="text" name="website" tabindex="-1" autocomplete="off" style="display:none" />
              <label>
                Email address
                <input name="email" type="email" autocomplete="email" required />
              </label>
              <label>
                Hotel name
                <input name="hotelName" required />
              </label>
              <label>
                City / country
                <input name="cityCountry" required />
              </label>
              <div class="inline-fields">
                <label>
                  Arrival date
                  <input name="arrivalDate" type="date" required />
                </label>
                <label>
                  Departure date
                  <input name="departureDate" type="date" required />
                </label>
              </div>
              <div class="inline-fields">
                <label>
                  # of adults
                  <input name="adults" type="number" min="1" value="2" required />
                </label>
                <label>
                  # of children
                  <input name="children" type="number" min="0" value="0" required />
                </label>
              </div>
              <label>
                Notes (optional)
                <textarea name="notes" placeholder="Any preferences or booking details to include?"></textarea>
              </label>
              <button type="submit">Submit</button>
            </form>
            <p class="status" id="tracking-status" role="status" aria-live="polite"></p>
          </div>
        </article>
        <aside class="page-visual page-image-pane page-visual-no-bottom" aria-hidden="true">
          <img src="/images/page-1.jpg" alt="" />
        </aside>
      </section>
    </main>

    <section class="partners-strip" aria-label="Preferred partners">
      <div class="partners-inner">
        <p class="partners-eyebrow">Preferred Partner Networks</p>
        <div class="partners-grid">
          <div class="partner-mark"><img src="/images/Virtuoso+Member_Vector.webp" alt="Virtuoso" /></div>
          <div class="partner-mark"><img src="/images/hyatt_prive_vector.webp" alt="Hyatt Prive" /></div>
          <div class="partner-mark"><img src="/images/belmond_Partner.webp" alt="Belmond Bellini Club" /></div>
          <div class="partner-mark"><img src="/images/Four_Seasons_Preferred_Partner_Vector.webp" alt="Four Seasons Preferred Partner" /></div>
        </div>
      </div>
